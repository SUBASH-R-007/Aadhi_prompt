<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aadhi render stub</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #stage { position: relative; width: 1920px; height: 1080px; font-family: sans-serif; color: #fff; }
    .title { position: absolute; left: 80px; top: 40px; font-size: 64px; font-weight: 700;
             background: rgba(40, 15, 60, 0.9); padding: 10px 24px; border-radius: 12px; }
    .board { position: absolute; left: 576px; top: 180px; width: 864px; display: flex; flex-direction: column;
             gap: 12px; }
    .item { font-size: 36px; background: rgba(40, 15, 60, 0.9); padding: 8px 16px; border-radius: 8px; }
    .item.hl { outline: 4px solid #ffd700; }
    .quiz { position: absolute; left: 576px; top: 180px; width: 864px; font-size: 40px;
            background: rgba(40, 15, 60, 0.9); padding: 16px; }
    .opt.correct { color: #00ff88; }
    .countdown { position: absolute; right: 80px; top: 40px; font-size: 96px; color: #ffd700; }
    .media { position: absolute; left: 576px; top: 160px; width: 1024px; height: 576px; visibility: hidden; }
    /* media holes must stay transparent: the panel frame has no background behind its media */
    .panel { position: absolute; left: 1460px; top: 180px; width: 400px; height: 600px;
             border: 4px solid #ffd700; box-sizing: border-box; font-size: 28px; padding: 8px; }
    .panel-media { position: absolute; left: 1480px; top: 260px; width: 360px; height: 360px; visibility: hidden; }
    .card { position: absolute; left: 0; top: 380px; width: 1920px; text-align: center; font-size: 80px; }
    .card .l2 { font-size: 48px; color: #ffd700; }
    .fig { position: absolute; left: 100px; top: 700px; width: 200px; height: 200px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="/stub-config.js"></script>
  <script src="/stub.js"></script>
</body>
</html>
