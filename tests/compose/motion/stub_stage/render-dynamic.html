<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aadhi Dynamic stage stub</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #202020; }
    .bit { position: absolute; top: 0; }
    #band { position: absolute; left: 0; }
    #media { position: absolute; left: 0; visibility: hidden; display: block; }
    #caption { position: absolute; left: 0; display: none; background: #ffffff; }
  </style>
  <script src="/stub-config.js"></script>
  <script type="module" src="/stage-stub.js"></script>
</head>
<body>
  <div id="stage"></div>
</body>
