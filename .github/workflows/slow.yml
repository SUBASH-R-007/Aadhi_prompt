name: Slow tests (manim / ffmpeg / playwright)

on:
  workflow_dispatch:
    inputs:
      eval:
        description: "Also run the eval harness with fake providers and upload the report"
        type: boolean
        default: true
  schedule:
    - cron: "30 2 * * 1"  # Mondays 02:30 UTC

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: System packages (ffmpeg, manim build deps, TeX Live, Noto + Indic fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm cm-super \
            fonts-noto-core fonts-noto-ui-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -r requirements.txt -r requirements-dev.txt

      - name: Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: npm ci (web/vendor for render mode)
        run: npm ci --no-audit --no-fund

      - name: Pytest (slow suite)
        run: pytest -m slow

      - name: Eval harness (fake providers)
        if: ${{ github.event_name == 'schedule' || inputs.eval }}
        run: python -m aadhi.evals run --provider fake --out evals/results/ci-${{ github.run_id }} --assets

      - name: Upload eval report
        if: ${{ always() && (github.event_name == 'schedule' || inputs.eval) }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            evals/results/ci-${{ github.run_id }}/report.json
            evals/results/ci-${{ github.run_id }}/report.md
            evals/results/ci-${{ github.run_id }}/*/metrics.json
          if-no-files-found: ignore
