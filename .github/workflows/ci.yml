name: CI

on:
  push:
    branches: [main, "overhaul/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # Tests force fake providers (tests/conftest.py); no secrets are available or needed here.
  LLM_PROVIDER: fake
  TTS_PROVIDER: fake

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: System packages (ffmpeg; cairo/pango headers in case wheels are unavailable)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -r requirements.txt -r requirements-dev.txt

      - name: Install frontend vendor bundle (web/vendor)
        run: npm ci --no-audit --no-fund

      - name: Ruff
        run: ruff check aadhi tests scripts evals docker

      - name: Generated files are current (.env.example, seccomp profile, eval fixtures)
        run: |
          python scripts/gen_env_example.py --check
          python scripts/gen_chromium_seccomp.py --check
          python evals/make_fixtures.py --check

      - name: Pytest (fast suite)
        run: pytest -m "not slow and not network"

  web:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci (runs scripts/vendor.mjs)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (JSDoc / tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (node --test)
        run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'docker')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          load: true
          tags: aadhi-eduengine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image contains no v1 leftovers or dev tools
        run: |
          docker run --rm --entrypoint sh aadhi-eduengine:ci -c '
            set -e
            for f in handoff.md vercel.json index.html old_index.html app_test.js tests docs evals \
                     video_template/video_template.mp4 web/tests; do
              if [ -e "/app/$f" ]; then echo "unexpected /app/$f"; exit 1; fi
            done
            test -f /app/web/index.html
            test -f /app/web/vendor/manifest.json
            test -f /app/video_template/aadhi_center.mp4
            if python -c "import pytest" 2>/dev/null; then echo "pytest is installed in the image"; exit 1; fi
            python -c "import uvloop, aadhi.main"'
      - name: Sandboxed Chromium starts inside the image (render-worker seccomp profile)
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; production hosts need
          # the same setting (docs/OPERATIONS.md section 4.2).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          docker run --rm --shm-size=1g --security-opt seccomp=docker/app/chromium-seccomp.json \
            aadhi-eduengine:ci python /app/docker/app/check_chromium.py
      - name: Validate docker-compose.yml (first start, with ADMIN_PASSWORD)
        env:
          POSTGRES_PASSWORD: ci-only
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123
          BASE_URL: https://ci.invalid
          ADMIN_PASSWORD: ci-only-admin-password
        run: docker compose config --quiet
      - name: Validate docker-compose.yml (after first login, ADMIN_PASSWORD removed)
        env:
          POSTGRES_PASSWORD: ci-only
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123
          BASE_URL: https://ci.invalid
        run: |
          docker compose config --quiet
          docker compose --profile s3 --profile sandbox --profile docker-sandbox config --quiet
