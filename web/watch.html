<!doctype html>
<html lang="en">

    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />

    <link rel="stylesheet" href="/web/css/tokens.css" />

    <div class="watch">
      <header class="watch-header">
        <div class="brand" aria-label="Rajalakshmi Engineering College, Aadhi EduEngine">
          <span class="brand-mark" aria-hidden="true">REC</span>

        <span>Rajalakshmi Engineering College</span>
        <span aria-hidden="true">·</span>
